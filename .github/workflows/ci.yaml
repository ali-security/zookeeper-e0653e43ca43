# This workflow will build a Java project with Maven
# See also:
#   https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Surefire -Dtest selector for the full-build-java-tests leg (empty runs the full suite)
        required: false
        default: ''

jobs:
  mvn:
    strategy:
      matrix:
        profile:
          - name: 'full-build-jdk8'
            jdk: 8
            args: '-Pfull-build verify -DskipTests'
          - name: 'full-build-jdk11'
            jdk: 11
            args: '-Pfull-build verify -DskipTests'
          - name: 'full-build-java-tests'
            jdk: 11
            args: '-Pfull-build verify -Dsurefire-forkcount=4 -DskipCppUnit -Dsurefire.rerunFailingTestsCount=5'
          - name: 'full-build-cppunit-tests'
            jdk: 11
            args: '-Pfull-build verify -Dtest=_ -DfailIfNoTests=false'
      fail-fast: false
    timeout-minutes: 48
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK ${{ matrix.profile.jdk }}
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.profile.jdk }}
        distribution: temurin
        cache: 'maven'
    - name: Show the first log message
      run: git log -n1
    - name: Install C Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcppunit-dev libsasl2-dev
    - name: Build with Maven (${{ matrix.profile.name }})
      run: |
        if [ -n "${{ inputs.test-filter }}" ] && [ "${{ matrix.profile.name }}" = "full-build-java-tests" ]; then
          mvn -B -V -e -ntp "-Dstyle.color=always" ${{ matrix.profile.args }} "-Dtest=${{ inputs.test-filter }}" -DfailIfNoTests=false
        else
          mvn -B -V -e -ntp "-Dstyle.color=always" ${{ matrix.profile.args }}
        fi
      env:
        MAVEN_OPTS: -Djansi.force=true
    - name: List skipped tests with reasons
      if: ${{ always() && matrix.profile.name == 'full-build-java-tests' }}
      run: |
        python3 - <<'EOF'
        import glob
        import re
        import xml.etree.ElementTree as ET
        def source_reason(cls, name):
            for src in glob.glob('**/src/test/java/' + cls.replace('.', '/') + '.java', recursive=True):
                lines = open(src, encoding='utf-8').read().splitlines()
                for i, line in enumerate(lines):
                    if re.search(r'\bvoid\s+' + re.escape(name) + r'\s*\(', line):
                        for prev in lines[max(0, i - 6):i]:
                            if '@Disabled' in prev:
                                return 'annotated %s in %s:%d' % (prev.strip(), src, i + 1)
            return None
        n = 0
        for f in sorted(glob.glob('**/target/surefire-reports/TEST-*.xml', recursive=True)):
            for tc in ET.parse(f).getroot().iter('testcase'):
                s = tc.find('skipped')
                if s is not None:
                    n += 1
                    name = re.sub(r'[(\[].*$', '', tc.get('name') or '')
                    reason = (s.get('message') or (s.text or '').strip()
                              or source_reason(tc.get('classname') or '', name)
                              or '(no message in surefire report)')
                    print('SKIPPED: %s.%s -- %s' % (tc.get('classname'), tc.get('name'), reason))
        print('Total skipped tests: %d' % n)
        EOF
    - name: Upload jars
      if: ${{ matrix.profile.name == 'full-build-jdk11' }}
      uses: actions/upload-artifact@v4
      with:
        name: zookeeper-jars
        path: |
          zookeeper-server/target/zookeeper-*[0-9].jar
          zookeeper-server/target/zookeeper-*-osgi.jar
          zookeeper-server/target/zookeeper-*-tests.jar
        if-no-files-found: error
    - name: Upload unit test results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports-${{ matrix.profile.name }}
        path: ./**/target/surefire-reports/
        if-no-files-found: ignore
    - name: Upload integration test results
      if: ${{ failure() }}
      uses: actions/upload-artifact@v4
      with:
        name: failsafe-reports-${{ matrix.profile.name }}
        path: ./**/target/failsafe-reports/
        if-no-files-found: ignore

