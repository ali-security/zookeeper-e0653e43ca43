language: java

matrix:
  include:
    - os: linux
      arch: arm64
      jdk: openjdk11

cache:
  directories:
  - "$HOME/.m2"

addons:
  apt:
    packages:
    - libcppunit-dev

install:
  - if [ "${TRAVIS_CPU_ARCH}" == "arm64" ]; then
     sudo apt-get install maven;
    fi

script: mvn clean verify -DskipTests -Pfull-build
